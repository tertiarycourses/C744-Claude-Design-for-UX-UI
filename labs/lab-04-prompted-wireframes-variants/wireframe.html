<!doctype html>
<html lang="en">
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Wellness booking wireframe</title>
<style>
body{font-family:Arial,sans-serif;margin:0;background:#eee;color:#222}.shell{max-width:420px;margin:24px auto;background:#fff;border:2px solid #444;padding:20px}.bar,.block,.button{border:2px solid #777;background:#f4f4f4;margin:12px 0;padding:16px}.bar{height:48px}.block{min-height:76px}.button{text-align:center;background:#ddd;font-weight:700}.row{display:grid;grid-template-columns:1fr 1fr;gap:12px}
</style>
<main class="shell"><div class="bar">Header + back</div><h1>Book an appointment</h1><div class="block">Progress indicator</div><div class="block">Service options</div><div class="row"><div class="block">Date</div><div class="block">Time</div></div><div class="block">Error / recovery state</div><div class="button">Primary action</div></main>
</html>
